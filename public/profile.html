<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – SocialHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="bg-blue-600 text-white p-3 shadow">
    <div class="container mx-auto flex justify-between items-center">
      <a href="/" class="text-2xl font-bold">SocialHub</a>
      <div>
        <a href="/" class="mr-4 hover:underline">Feed</a>
        <a href="/explore.html" class="mr-4 hover:underline">Explore</a>
        <a href="/notifications.html" class="mr-4 hover:underline">🔔</a>
        <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 max-w-2xl">
    <div id="profileContainer" class="bg-white rounded shadow p-6">
      <div class="flex items-center gap-4">
        <img id="profilePic" src="" alt="Profile" class="w-20 h-20 rounded-full object-cover">
        <div class="flex-1">
          <h2 id="profileUsername" class="text-2xl font-bold"></h2>
          <p id="profileBio" class="text-gray-600"></p>
          <p id="followStats" class="text-sm text-gray-500"></p>
          <button id="followBtn" class="mt-2 bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700 hidden">Follow</button>
          <button id="editProfileBtn" class="mt-2 bg-gray-200 text-gray-800 px-4 py-1 rounded hover:bg-gray-300 hidden">Edit Profile</button>
        </div>
      </div>
      <div id="userPosts" class="mt-6 space-y-4"></div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded shadow-lg p-6 w-96">
      <h3 class="text-xl font-bold mb-4">Edit Profile</h3>
      <form id="editProfileForm">
        <label class="block text-sm font-medium">Bio</label>
        <textarea id="editBio" rows="3" class="w-full p-2 border rounded mb-3"></textarea>
        <label class="block text-sm font-medium">Profile Picture</label>
        <input type="file" id="editProfilePic" accept="image/*" class="w-full p-2 border rounded mb-3">
        <div class="flex justify-end gap-2">
          <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')" class="px-4 py-2 bg-gray-300 rounded">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded shadow opacity-0 transition-opacity duration-300"></div>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
