<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialHub – Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="bg-blue-600 text-white p-3 shadow">
    <div class="container mx-auto flex justify-between items-center">
      <a href="/" class="text-2xl font-bold">SocialHub</a>
      <div id="navLinks">
        <a href="/" class="mr-4 hover:underline font-bold">Feed</a>
        <a href="/explore.html" class="mr-4 hover:underline">Explore</a>
        <a href="/notifications.html" class="mr-4 hover:underline">🔔</a>
        <a href="/profile.html" class="mr-4 hover:underline">Profile</a>
        <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- LEFT COLUMN -->
    <div class="lg:col-span-2 space-y-4">
      <!-- Create Post Box (outside #feed) -->
      <div class="bg-white rounded shadow p-4" id="createPostBox">
        <textarea id="postContent" rows="3" placeholder="What's on your mind? Use #hashtags" class="w-full p-2 border rounded"></textarea>
        <input type="file" id="postFile" accept="image/*,video/*" class="w-full p-2 border rounded mt-2">
        <p class="text-xs text-gray-500 mt-1">Upload images or videos (max 100MB)</p>
        <button id="createPostBtn" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Post</button>
      </div>

      <!-- Feed list (only posts) -->
      <div id="feed" class="space-y-4"></div>
    </div>

    <!-- RIGHT COLUMN – Suggestions -->
    <aside class="lg:col-span-1">
      <div id="suggestions" class="bg-white rounded shadow p-4">
        <h3 class="font-bold text-lg mb-3">Suggestions</h3>
        <div id="suggestionList" class="space-y-2"></div>
      </div>
    </aside>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded shadow opacity-0 transition-opacity duration-300"></div>

  <script src="/js/app.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
